<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

      
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            
            background-color: #3a3a3a;
            padding: 10px 20px;
        }

       
        nav>div {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        
        nav a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

   
        nav a:hover {
            color: #f1c40f;
        }

        nav i {
            font-size: 18px;
        }

  
        nav>div:first-child i {
            font-size: 22px;
            color: #f1c40f;
        }

        nav div {
            color: white;
        }

        @media screen and (max-width: 350px){
            .input{
                display: none;
            }

            .section1{
                flex-direction: column;
            }

            .section2{
                flex-direction: column;
            }
        }

        @media screen and (max-width: 700px) {
            input {
                width: 50px;
            }

            nav>div {
                align-items: center;
                gap: 5px;
            }

            nav {
                justify-content: space-between;
                align-items: center;
                /* vertical alignment */
        }

        }

    </style>
</head>

<body>
    <nav>
        <div class="section1">
            <div>
                <a href="#"><i class="fa-regular fa-font-awesome"></i></a>
            </div>
            <div><a href="#">home</a></div>
            <div><a href="#">contact</a></div>
        </div>
        <div class="input">
            <div >
                <input type="text" placeholder="Search..." style="padding: 5px; border-radius: 5px; border: grey; box-shadow: #2c3e50;"> 

            </div>
            <div><a href="#"><i class="fa-solid fa-magnifying-glass"></i></a></div>
        </div>
        <div class="section2">
            <div><a href="#"><i class="fa-solid fa-image-portrait"></i></i></a></div>
            <div><a href="#">logout</a></div>
        </div>
    </nav>
</body>

</html>
