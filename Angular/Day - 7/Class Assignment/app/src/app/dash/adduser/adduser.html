<p>Add User</p>

<form #userForm="ngForm" (ngSubmit)="handleSubmit(userForm.value)">

    <legend>Add a new User</legend>

    <div>
        <input type="text" placeholder="name" [(ngModel)]="UserData.name" name="name" required>
    </div>

    <div>
        <input type="text" placeholder="role" [(ngModel)]="UserData.role" name="role" required>
    </div>

    <div>
        <input type="text" placeholder="image" [(ngModel)]="UserData.image" name="image" required>
    </div>

    <button type="submit">Add User</button>

</form>
